<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="100%" style="stop-color:#764BA2"/>
    </linearGradient>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 代码文件图标 -->
  <g transform="translate(128, 128)">
    <!-- 文件主体 -->
    <rect x="-60" y="-70" width="120" height="140" rx="8" fill="#FFFFFF"/>
    
    <!-- 文件右上角折角 -->
    <path d="M 20 -70 L 60 -70 L 60 -30 Z" fill="#E0E0E0"/>
    
    <!-- 代码行 - 第一行 -->
    <rect x="-45" y="-50" width="70" height="8" rx="2" fill="#3498DB"/>
    <rect x="30" y="-50" width="20" height="8" rx="2" fill="#E74C3C"/>
    
    <!-- 代码行 - 第二行 -->
    <rect x="-45" y="-35" width="40" height="8" rx="2" fill="#27AE60"/>
    <rect x="0" y="-35" width="50" height="8" rx="2" fill="#9B59B6"/>
    
    <!-- 代码行 - 第三行 -->
    <rect x="-45" y="-20" width="55" height="8" rx="2" fill="#F39C12"/>
    <rect x="15" y="-20" width="35" height="8" rx="2" fill="#1ABC9C"/>
    
    <!-- 代码行 - 第四行 -->
    <rect x="-45" y="-5" width="30" height="8" rx="2" fill="#E67E22"/>
    <rect x="-10" y="-5" width="60" height="8" rx="2" fill="#34495E"/>
    
    <!-- 代码行 - 第五行 -->
    <rect x="-45" y="10" width="80" height="8" rx="2" fill="#3498DB"/>
    
    <!-- 代码行 - 第六行 -->
    <rect x="-45" y="25" width="25" height="8" rx="2" fill="#95A5A6"/>
    <rect x="-15" y="25" width="55" height="8" rx="2" fill="#E74C3C"/>
    
    <!-- 代码行 - 第七行 -->
    <rect x="-45" y="40" width="50" height="8" rx="2" fill="#27AE60"/>
    <rect x="10" y="40" width="40" height="8" rx="2" fill="#9B59B6"/>
    
    <!-- 底部装饰线 -->
    <rect x="-45" y="55" width="90" height="3" rx="1.5" fill="#BDC3C7"/>
  </g>
  
  <!-- 清理/擦除图标 -->
  <circle cx="200" cy="200" r="28" fill="#27AE60"/>
  <path d="M 190 200 L 197 207 L 212 192" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>